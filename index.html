  <head>
    <meta charset="UTF-8" />

    <title>How good is “good”?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />

      <article>
        <div class="content--intro">
          <hgroup>
            <h1
              >How good <br />
              is “good”?</h1

            <p>UK Word Sentiment Survey</p>
          </hgroup>
        </div>

        <p
          >This is a remake of
          <a
            href="https://yougov.com/en-gb/articles/21568-how-good-good"

          >
          looking at how positively and negatively Britons rate a selection of
          adjectives. The respondents score each word/phrase on a scale from
          0-10, with 0 being “very negative” and 10 being “very positive”.</p
